[package]
name = "chain-lens"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "chain-lens"
path = "src/main.rs"

[[bin]]
name = "chain-lens-web"
path = "src/bin/web_server.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true